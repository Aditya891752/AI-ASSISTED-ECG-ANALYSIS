name: CI

on:
  push:
    branches: [main, dev, feature/v2-redesign]
  pull_request:
    branches: [main, feature/v2-redesign]

jobs:
  # ── Backend: lint + type-check ────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports are clean
        run: python -c "from app.main import create_app; print('Import OK')"

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true   # Tests need DB; don't fail CI on missing infra

  # ── Frontend: type-check + build ─────────────────────────────────────────
  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc -b

      - name: Production build
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
